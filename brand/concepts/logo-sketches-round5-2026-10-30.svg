<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1320" width="1180" height="1320" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>PrintMarshal app icon sketches, round 5: kept marks, word icons, Office-style tiles</title>
  <style>
