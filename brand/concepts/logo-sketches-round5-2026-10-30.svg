    <g transform="translate(20,20)"><rect width="200" height="200" rx="46" fill="url(#gCobalt)"/><rect width="200" height="200" rx="46" fill="url(#gloss)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"><use href="#shield" x="12" y="10" width="176" height="176"/></g>
      <g color="#FFFFFF"><use href="#mfp" x="52" y="44" width="96" height="96"/></g></g>
    <g transform="translate(240,20)"><rect width="100" height="100" rx="23" fill="url(#gCobalt)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"><use href="#shield" x="6" y="5" width="88" height="88"/></g>
      <g color="#FFFFFF"><use href="#mfp" x="26" y="22" width="48" height="48"/></g></g>
    <g transform="translate(240,140)"><rect width="48" height="48" rx="11" fill="url(#gCobalt)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"><use href="#shield" x="3" y="2" width="42" height="42"/></g>
      <g color="#FFFFFF"><use href="#mfp-s" x="13" y="11" width="22" height="22"/></g>
      <rect x="60" width="24" height="24" rx="5.5" fill="url(#gCobalt)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><use href="#shield" x="62" y="1.5" width="20" height="20"/></g>
      <g color="#FFFFFF"><use href="#mfp-s" x="67" y="6" width="10" height="10"/></g></g>
    <text x="16" y="262" class="label">1. Shield and MFP, Cobalt</text>
    <text x="16" y="284" class="note">White outline shield holding the full MFP.</text>
  </g>
  <g transform="translate(410,110)">
