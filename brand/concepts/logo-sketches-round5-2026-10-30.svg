      <text class="tile" x="50" y="165" font-size="52" fill="#FFFFFF" text-anchor="middle">P</text></g>
    <g transform="translate(240,20)"><rect width="100" height="100" rx="23" fill="url(#gCobalt)"/>
      <g style="--bg:#2E54E6"><use href="#mfp-fill" x="18" y="11" width="75" height="75"/></g>
      <rect x="8" y="56" width="34" height="34" rx="7.5" fill="#1E3AA8"/>
      <text class="tile" x="25" y="82.5" font-size="26" fill="#FFFFFF" text-anchor="middle">P</text></g>
    <g transform="translate(240,140)"><rect width="48" height="48" rx="11" fill="url(#gCobalt)"/>
      <g style="--bg:#2E54E6"><use href="#mfp-fill" x="9" y="5" width="36" height="36"/></g>
      <rect x="4" y="27" width="17" height="17" rx="4" fill="#1E3AA8"/>
      <text class="tile" x="12.5" y="40" font-size="13" fill="#FFFFFF" text-anchor="middle">P</text>
      <rect x="60" width="24" height="24" rx="5.5" fill="#1E3AA8"/>
      <text class="tile" x="72" y="18.5" font-size="18" fill="#FFFFFF" text-anchor="middle">P</text></g>
    <text x="16" y="262" class="label">O1. Filled MFP, "P" tile</text>
    <text x="16" y="284" class="note">White blocks with the background showing as the outline,</text>
    <text x="16" y="302" class="note">a Deep tile with "P" at the corner. 16 px is the tile alone.</text>
  </g>
  <g transform="translate(410,910)">
