      <text class="mono" x="100" y="106" font-size="40" fill="#FFFFFF" text-anchor="middle">print</text></g>
    <g transform="translate(240,20)"><rect width="100" height="100" rx="23" fill="url(#gCobalt)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"><use href="#shield" x="6" y="5" width="88" height="88"/></g>
      <text class="mono" x="50" y="53" font-size="20" fill="#FFFFFF" text-anchor="middle">print</text></g>
    <g transform="translate(240,140)"><rect width="48" height="48" rx="11" fill="url(#gCobalt)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"><use href="#shield" x="3" y="2" width="42" height="42"/></g>
      <text class="mono" x="24" y="29" font-size="22" fill="#FFFFFF" text-anchor="middle">p</text>
      <rect x="60" width="24" height="24" rx="5.5" fill="url(#gCobalt)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><use href="#shield" x="62" y="1.5" width="20" height="20"/></g>
      <text class="mono" x="72" y="15" font-size="11" fill="#FFFFFF" text-anchor="middle">p</text></g>
