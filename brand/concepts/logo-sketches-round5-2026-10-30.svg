      <rect x="8" y="56" width="34" height="34" rx="7.5" fill="#2E54E6"/>
      <text class="tile" x="25" y="82.5" font-size="26" fill="#FFFFFF" text-anchor="middle">P</text></g>
    <g transform="translate(240,140)"><rect width="48" height="48" rx="11" fill="url(#gGraphite)"/>
      <g style="--bg:#1F2530"><use href="#mfp-fill" x="9" y="5" width="36" height="36"/></g>
      <rect x="4" y="27" width="17" height="17" rx="4" fill="#2E54E6"/>
      <text class="tile" x="12.5" y="40" font-size="13" fill="#FFFFFF" text-anchor="middle">P</text>
