      <g fill="none" stroke="#E8ECF2" stroke-width="6" stroke-linejoin="round"><use href="#shield" x="12" y="10" width="176" height="176"/></g>
      <g color="#E8ECF2"><use href="#mfp" x="52" y="44" width="96" height="96"/></g></g>
    <g transform="translate(240,20)"><rect width="100" height="100" rx="23" fill="url(#gGraphite)"/>
