      <g color="#2E54E6"><use href="#mfp-s" x="67" y="6" width="10" height="10"/></g></g>
    <text x="16" y="262" class="label">6. Light icon, same mark</text>
    <text x="16" y="284" class="note">Graphite on Mist, now with the same shield and full MFP;</text>
    <text x="16" y="302" class="note">one-ink glyphs beside it.</text>
  </g>

  <text x="30" y="498" class="row">WORD INSTEAD OF PICTURE</text>
  <g transform="translate(30,510)">
    <rect width="360" height="340" rx="12" fill="#FFFFFF" stroke="#E8ECF2"/>
    <g transform="translate(20,20)"><rect width="200" height="200" rx="46" fill="url(#gCobalt)"/><rect width="200" height="200" rx="46" fill="url(#gloss)"/>
      <text class="mono" x="100" y="118" font-size="54" fill="#FFFFFF" text-anchor="middle">print</text></g>
    <g transform="translate(240,20)"><rect width="100" height="100" rx="23" fill="url(#gCobalt)"/>
      <text class="mono" x="50" y="59" font-size="27" fill="#FFFFFF" text-anchor="middle">print</text></g>
