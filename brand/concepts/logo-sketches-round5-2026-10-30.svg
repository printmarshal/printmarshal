    <g transform="translate(20,20)"><rect width="200" height="200" rx="46" fill="url(#gGraphite)"/><rect width="200" height="200" rx="46" fill="url(#gloss)"/>
      <text class="mono" x="22" y="116" font-size="44" fill="#E8ECF2">print</text>
      <rect x="158" y="82" width="22" height="38" rx="3" fill="#2E54E6"/></g>
    <g transform="translate(240,20)"><rect width="100" height="100" rx="23" fill="url(#gGraphite)"/>
      <text class="mono" x="11" y="58" font-size="22" fill="#E8ECF2">print</text>
      <rect x="79" y="41" width="11" height="19" rx="1.5" fill="#2E54E6"/></g>
    <g transform="translate(240,140)"><rect width="48" height="48" rx="11" fill="url(#gGraphite)"/>
      <text class="mono" x="10" y="34" font-size="30" fill="#E8ECF2">p</text>
      <rect x="29" y="12" width="9" height="20" rx="1.5" fill="#2E54E6"/>
      <rect x="60" width="24" height="24" rx="5.5" fill="url(#gGraphite)"/>
      <text class="mono" x="65" y="17.5" font-size="16" fill="#E8ECF2">p</text>
      <rect x="75" y="6" width="4.5" height="10" rx="1" fill="#2E54E6"/></g>
    <text x="16" y="262" class="label">W2. The word with a cursor, Graphite</text>
    <text x="16" y="284" class="note">"print" in Mist with a Cobalt block cursor after it:</text>
    <text x="16" y="302" class="note">a terminal prompt, the developer read.</text>
  </g>
  <g transform="translate(790,510)">
    <rect width="360" height="340" rx="12" fill="#FFFFFF" stroke="#E8ECF2"/>
    <g transform="translate(20,20)"><rect width="200" height="200" rx="46" fill="url(#gCobalt)"/><rect width="200" height="200" rx="46" fill="url(#gloss)"/>
