      <g color="#E8ECF2"><use href="#mfp-s" x="67" y="6" width="10" height="10"/></g></g>
    <text x="16" y="262" class="label">2. Shield and MFP, Graphite</text>
    <text x="16" y="284" class="note">The same mark in Mist on Graphite.</text>
  </g>
  <g transform="translate(790,110)">
