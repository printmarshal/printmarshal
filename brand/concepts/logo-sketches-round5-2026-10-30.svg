      <rect x="3" y="27" width="23" height="17" rx="4" fill="#1E3AA8"/>
      <text class="tile" x="14.5" y="39.5" font-size="11.5" fill="#FFFFFF" text-anchor="middle">PM</text>
      <rect x="60" width="24" height="24" rx="5.5" fill="#1E3AA8"/>
      <text class="tile" x="72" y="17.5" font-size="12.5" fill="#FFFFFF" text-anchor="middle">PM</text></g>
    <text x="16" y="262" class="label">O2. Filled MFP, "PM" tile</text>
    <text x="16" y="284" class="note">Same, with a wider "PM" tile. Later apps change the tile</text>
    <text x="16" y="302" class="note">letters and the picture, like Word, Excel, Outlook.</text>
  </g>
  <g transform="translate(790,910)">
