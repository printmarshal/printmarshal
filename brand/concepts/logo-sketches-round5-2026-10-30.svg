    <text x="16" y="284" class="note">Lowercase mono "print" from the wordmark, white on</text>
    <text x="16" y="302" class="note">Cobalt, like Zoom. Falls back to "p" from 32 px down.</text>
  </g>
  <g transform="translate(410,510)">
