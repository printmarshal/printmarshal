    <g transform="translate(240,140)"><rect width="48" height="48" rx="11" fill="url(#gGraphite)"/>
      <g fill="none" stroke="#E8ECF2" stroke-width="2.5" stroke-linejoin="round"><use href="#shield" x="3" y="2" width="42" height="42"/></g>
      <g color="#E8ECF2"><use href="#mfp-s" x="13" y="11" width="22" height="22"/></g>
      <rect x="60" width="24" height="24" rx="5.5" fill="url(#gGraphite)"/>
