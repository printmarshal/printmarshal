<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#F4F6F9;font-family:system-ui,-apple-system,sans-serif;color:#14171E;width:1180px}
h1{font-size:24px;margin:24px 30px 4px}p{margin:0 30px 18px;color:#5B6676;font-size:13px}
.row{display:flex;gap:20px;padding:0 30px 20px}.card{background:#fff;border:1px solid #E8ECF2;border-radius:12px;padding:20px;width:333px}
.big{display:block;width:256px;height:256px;margin-bottom:16px}.sizes{display:flex;align-items:flex-end;gap:14px}.sizes img{display:block}
.cap{font-size:16px;font-weight:600;margin-top:14px}.sub{font-size:12px;color:#5B6676}
.dock{background:#14171E;border-radius:12px;padding:14px;display:flex;gap:14px;align-items:flex-end;margin:0 30px 24px;width:1092px;box-sizing:border-box}
.dock.light{background:#E8ECF2}.dock img{display:block}
</style></head><body>

<div class="row">

<div class="card"><img class="big" src="png/app-icon-d3-256.png"><div class="sizes"><img src="png/app-icon-d3-128.png" width="128"><img src="png/app-icon-d3-64.png" width="64"><img src="png/app-icon-d3-32.png" width="32"><img src="png/app-icon-d3-16.png" width="16"></div><div class="cap">D3 Black</div><div class="sub">app-icon-d3.svg</div></div>
</div>
<div class="dock"><img src="png/app-icon-d1-64.png" width="64"><img src="png/app-icon-d2-64.png" width="64"><img src="png/app-icon-d3-64.png" width="64"><img src="png/glyph-shield-p-64.png" width="64"><img src="png/glyph-shield-p-light-64.png" width="64"><img src="png/glyph-shield-p-32.png" width="32"><img src="png/glyph-shield-p-light-32.png" width="32"><img src="png/glyph-shield-p-16.png" width="16"><img src="png/glyph-shield-p-light-16.png" width="16"></div>

</body></html>
