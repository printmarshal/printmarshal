# Assigns every newly opened issue to the maintainer so nothing sits
# unowned. Change ASSIGNEES to hand issues to someone else or to several
# people.
name: Auto-assign new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

env:
  ASSIGNEES: melonfleet

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const assignees = process.env.ASSIGNEES.split(',').map(s => s.trim()).filter(Boolean)
            if (context.payload.issue.assignees.length === 0) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                assignees,
              })
            }
