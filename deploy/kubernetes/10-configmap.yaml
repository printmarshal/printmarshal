# Full configuration reference: docs/operations.md ("Configuration reference").
# Anything here can also be overridden with PM_* environment variables on the
# Deployment.  Secrets never go in this file: SMTP passwords are read from the
# environment variable named in "passwordEnv".
apiVersion: v1
kind: ConfigMap
metadata:
  name: printmarshal-config
  namespace: printmarshal
  labels:
    app.kubernetes.io/name: printmarshal
data:
  printmarshal.json: |
    {
      "listen": ":8080",
      "dataDir": "/data",
      "database": "sqlite",
      "poll": {
        "interval": "5m",
        "concurrency": 32,
        "snmpTimeout": "2s",
        "snmpRetries": 1,
        "ippTimeout": "4s",
        "ippInsecureTls": true
      },
      "discovery": {
        "enabled": false,
        "interval": "1h",
        "mdnsWait": "5s",
        "wsdWait": "3s",
        "scanWorkers": 64,
        "maxAddresses": 4096,
        "targets": []
      },
      "trap": { "enabled": true, "listen": "0.0.0.0:1162" },
      "alerts": { "supplyWarningPercent": 15, "supplyCriticalPercent": 5, "offlineAfterFailures": 2 },
      "notifiers": [],
      "jobs": { "workers": 4 },
      "auth": { "sessionTtl": "720h", "secureCookies": false },
      "telemetry": { "retention": "2160h" }
    }
