# /data holds the SQLite database (WAL mode), secret.key (unless PM_SECRET_KEY is
# set) and uploaded firmware packages under firmware/.  SQLite needs a real
# POSIX filesystem: use block storage (RWO), not NFS/SMB, or you will see
# "database is locked" and risk corruption.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: printmarshal-data
  namespace: printmarshal
  labels:
    app.kubernetes.io/name: printmarshal
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: fast-ssd
  resources:
    requests:
      storage: 5Gi
