# Replace the placeholders before applying, or create the Secret out of band
# (preferred, so no secret is ever committed):
#
#   kubectl -n printmarshal create secret generic printmarshal-secrets \
#     --from-literal=PM_ADMIN_PASSWORD="$(openssl rand -base64 18)" \
#     --from-literal=PM_SECRET_KEY="$(openssl rand -base64 32)"
#
# PM_SECRET_KEY encrypts every stored device credential.  Losing it makes those
# credentials unrecoverable, so back this Secret up together with the /data
# volume (docs/operations.md, "Backups").  If PM_SECRET_KEY is omitted the
# server generates /data/secret.key instead and that file must be backed up.
# PM_ADMIN_PASSWORD is only read on the very first start (empty database).
apiVersion: v1
kind: Secret
metadata:
  name: printmarshal-secrets
  namespace: printmarshal
  labels:
    app.kubernetes.io/name: printmarshal
type: Opaque
stringData:
  PM_ADMIN_PASSWORD: CHANGE-ME-initial-admin-password
  PM_SECRET_KEY: CHANGE-ME-base64-of-32-random-bytes
