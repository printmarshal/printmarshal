{{- if not .Values.secrets.existingSecret }}
{{- $name := include "printmarshal.secretName" . }}
{{- /* Keep values that were generated on a previous install/upgrade: a new
       PM_SECRET_KEY would make every stored device credential unreadable. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.secrets.secretKey }}
{{- if and (not $key) .Values.secrets.generateSecretKey }}
{{-   if and $existing $existing.data (hasKey $existing.data "PM_SECRET_KEY") }}
{{-     $key = index $existing.data "PM_SECRET_KEY" | b64dec }}
{{-   else }}
{{-     $key = randAlphaNum 32 | b64enc }}
{{-   end }}
{{- end }}
{{- $pw := .Values.secrets.adminPassword }}
{{- if and (not $pw) $existing $existing.data (hasKey $existing.data "PM_ADMIN_PASSWORD") }}
{{-   $pw = index $existing.data "PM_ADMIN_PASSWORD" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "printmarshal.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $pw }}
  PM_ADMIN_PASSWORD: {{ $pw | b64enc | quote }}
  {{- end }}
  {{- if $key }}
  PM_SECRET_KEY: {{ $key | b64enc | quote }}
  {{- end }}
{{- end }}
